<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>国土の白模型 — tadataka</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#e7edf5;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#app canvas{touch-action:none;display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));
  pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#left{min-width:0;flex:1}
#hud .title{color:#39414d;font-size:15px;font-weight:600;text-shadow:0 1px 3px rgba(255,255,255,.7)}
#hud .title small{display:block;font-weight:400;font-size:11px;color:#6a7482;margin-top:3px}
#hud .status{display:block;font-weight:400;font-size:11px;color:#3d6b8f;margin-top:2px}
#hud .warn{display:none;font-weight:400;font-size:11px;color:#a05a2c;margin-top:2px}

/* --- 検索窓 --- */
#searchwrap{position:relative;margin-top:8px;max-width:330px;pointer-events:auto}
#searchbox{width:100%;box-sizing:border-box;padding:10px 12px;font-size:15px;color:#2b3646;
  border:1px solid rgba(43,54,70,.18);border-radius:10px;background:rgba(255,255,255,.92);
  box-shadow:0 1px 6px rgba(43,54,70,.12);outline:none;-webkit-user-select:text;user-select:text}
#searchbox:focus{border-color:#4a6076;box-shadow:0 1px 10px rgba(43,54,70,.22)}
#results{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:rgba(255,255,255,.97);
  border-radius:10px;box-shadow:0 4px 18px rgba(43,54,70,.22);overflow:hidden;display:none;max-height:52vh;overflow-y:auto}
#results div.r{padding:9px 12px;cursor:pointer;border-bottom:1px solid rgba(43,54,70,.08);font-size:14px;color:#2b3646}
#results div.r:last-child{border-bottom:none}
#results div.r:hover,#results div.r.sel{background:#eef3f9}
#results div.r b{font-weight:600}
#results div.r span.src{float:right;font-size:10px;color:#fff;background:#8b98a6;border-radius:4px;padding:1px 6px;margin-left:8px}
#results div.r span.src.addr{background:#5b7fa6}
#results div.r small{display:block;font-size:11px;color:#7b8794;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results div.msg{padding:10px 12px;font-size:13px;color:#7b8794}

#btns{display:flex;gap:8px;flex-shrink:0}
#vrbtn,#modebtn,#bldgbtn{pointer-events:auto;background:#2b3646;color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:14px;cursor:pointer;white-space:nowrap}
#modebtn{background:#4a6076}
#bldgbtn{background:#6b7f93}
#vrbtn:disabled{background:#9aa2ad;cursor:default}
#help{position:fixed;bottom:0;left:0;right:0;padding:10px 18px;color:#6a7482;font-size:11px;text-shadow:0 1px 3px rgba(255,255,255,.7);pointer-events:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#39414d;font-size:14px;background:#e7edf5;text-align:center;padding:20px}

/* --- タッチ操作 --- */
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
#stick{position:absolute;left:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;
  background:rgba(255,255,255,.30);border:1px solid rgba(43,54,70,.20);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;
  background:rgba(43,54,70,.72);transform:translate(-50%,-50%);pointer-events:none}
#tbtns{position:absolute;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;pointer-events:auto}
#tbtns button{width:58px;height:58px;border-radius:50%;border:1px solid rgba(43,54,70,.20);
  background:rgba(255,255,255,.75);color:#2b3646;font-size:19px;font-weight:600;touch-action:none;cursor:pointer}
#tbtns button.on{background:#2b3646;color:#fff}
@media (pointer: coarse){
  #help{display:none}
  #hud .title small{display:none}
  #searchwrap{max-width:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">国土を読み込み中…<br><small>標高・道路・空中写真: 国土地理院</small></div>
<div id="hud">
  <div id="left">
    <div class="title"><span class="place">国土の白模型</span>
      <small>標高・道路・空中写真: 国土地理院 ｜ 地名検索: 国土地理院 / OpenStreetMap contributors(リアルタイム取得・このページはデータを保持しません)</small>
      <span class="status"></span>
      <span class="warn"></span>
    </div>
    <div id="searchwrap">
      <input id="searchbox" type="search" placeholder="場所を検索(地名・住所・山・施設)" autocomplete="off" autocorrect="off" spellcheck="false">
      <div id="results"></div>
    </div>
  </div>
  <div id="btns">
    <button id="bldgbtn">建物</button>
    <button id="modebtn">白模型 ▸ 空中写真</button>
    <button id="vrbtn">VRで入る</button>
  </div>
</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="tbtns">
    <button id="tsprint" title="加速">≫</button>
    <button id="tup" title="上昇">▲</button>
    <button id="tdn" title="下降">▼</button>
  </div>
</div>
<div id="help">PC: <b>WASD=移動</b> / <b>矢印キー=視点</b>(←→首振り, ↑↓見上げ見下ろし) / Space=水平に戻す / R・F=上昇下降 / Shift=加速 / T=白模型⇄空中写真 ｜ マウス(画面クリックでロック)でも視点操作可 ｜ VR: 左スティック=移動, 右スティック左右=向き・上下=上昇下降, トリガー=加速, B・Yボタン=表示切替</div>
